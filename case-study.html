    "title": "Madonna / DistKV",
    "subtitle": "A small distributed key-value store built to make replication and failure behavior inspectable.",
    "problem": "Build a persistent key-value service that stays usable across a small cluster and makes routing, replication, and node failures understandable.",

    "implementation": "Each node uses the same role. Heartbeats run every 500 ms, and three missed checks mark a peer down. The WAL is replayed at startup; replication is fanned out to live peers after a local durable write.",
    "challenges": "Keeping key ownership stable while nodes change state, recovering state from an append-only log, and making cross-node routing and replication observable in a compact cluster.",
    "results": "Runs as a three-node Docker Compose cluster with a browser monitor. The repository includes tests and benchmarks, but does not publish benchmark figures; no latency or throughput claim is made here.",
    "learned": "For v2, add quorum or tunable consistency, membership that scales beyond direct peer checks, and reproducible benchmark reports that include hardware and workload details.",
